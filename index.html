<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Портфолио учителя начальных классов</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ---------- ОБЩИЙ СБРОС И РАДУЖНЫЙ АНИМИРОВАННЫЙ ФОН ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            color: #2d2d2d;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            background: #f9f3e8;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                #ff9a9e 0%, #fad0c4 10%, #fbc2eb 20%, #a18cd1 30%, 
                #fbc2eb 40%, #a1c4fd 50%, #c2e9fb 60%, #fbc2eb 70%, 
                #fad0c4 80%, #ff9a9e 90%, #fbc2eb 100%
            );
            background-size: 400% 400%;
            animation: rainbowMove 15s ease infinite;
            z-index: -2;
        }

        @keyframes rainbowMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.3) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(255,255,255,0.25) 0%, transparent 40%),
                radial-gradient(circle at 40% 90%, rgba(255,255,255,0.2) 0%, transparent 35%),
                radial-gradient(circle at 90% 10%, rgba(255,255,255,0.2) 0%, transparent 30%),
                radial-gradient(circle at 50% 50%, rgba(255,215,0,0.15) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* ---------- ВЕРХНЯЯ ПАНЕЛЬ ---------- */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 3px solid #ffb07c;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            min-height: 60px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .burger {
            display: flex;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 4px;
            background: none;
            border: none;
            transition: transform 0.3s;
        }
        .burger span {
            display: block;
            width: 28px;
            height: 4px;
            background: #ff7f50;
            border-radius: 4px;
            transition: all 0.3s;
        }
        .burger.active span:nth-child(1) { transform: rotate(45deg) translate(6px,6px); }
        .burger.active span:nth-child(2) { opacity: 0; }
        .burger.active span:nth-child(3) { transform: rotate(-45deg) translate(6px,-6px); }
        .header-title {
            font-size: 20px;
            font-weight: 900;
            color: #ff7f50;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0 #ffe0b0;
        }
        .header-title span { display: inline-block; animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-3px); } }
        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .auth-status {
            font-size: 13px;
            font-weight: 700;
            color: #ff7f50;
            border: 2px solid #ffb07c;
            padding: 5px 16px;
            border-radius: 30px;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .auth-status:hover { background: #ffb07c; color: #fff; }
        .auth-status.logged { border-color: #4caf50; color: #4caf50; }

        /* ---------- ВЫДВИЖНОЕ МЕНЮ ---------- */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 90;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s, visibility 0.4s;
        }
        .sidebar-overlay.open { opacity: 1; visibility: visible; }
        .sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 280px;
            height: 100%;
            background: rgba(255, 249, 240, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 4px solid #ffb07c;
            z-index: 99;
            padding: 24px 16px 20px;
            transition: left 0.4s cubic-bezier(0.4,0,0.2,1);
            overflow-y: auto;
            box-shadow: 4px 0 30px rgba(0,0,0,0.15);
        }
        .sidebar.open { left: 0; }
        .sidebar-profile {
            text-align: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 3px dashed #ffb07c;
        }
        .sidebar-profile .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffb07c, #ff7f50);
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #fff;
            box-shadow: 0 0 0 4px #ffe0b0;
        }
        .sidebar-profile h3 { font-size: 18px; font-weight: 800; color: #4a2c1a; }
        .sidebar-profile .sub { font-size: 13px; color: #ff7f50; font-weight: 600; }
        .sidebar-nav { list-style: none; padding: 0; }
        .sidebar-nav li { margin-bottom: 2px; }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: 16px;
            color: #4a2c1a;
            text-decoration: none;
            font-size: 15px;
            font-weight: 700;
            transition: all 0.2s;
            cursor: pointer;
        }
        .sidebar-nav a:hover,
        .sidebar-nav a:active { background: #ffb07c30; color: #e65100; transform: translateX(4px); }
        .sidebar-nav a.active { background: #ffb07c40; color: #e65100; box-shadow: inset 4px 0 0 #ff7f50; }
        .sidebar-nav .sub-menu {
            list-style: none;
            padding-left: 36px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
        }
        .sidebar-nav .sub-menu.open { max-height: 400px; }
        .sidebar-nav .sub-menu a {
            padding: 6px 12px;
            font-size: 14px;
            font-weight: 600;
            color: #6b4a2e;
        }
        .sidebar-nav .sub-menu a:hover { color: #e65100; }
        .sidebar-nav .sub-menu a.active { background: #ffb07c30; color: #e65100; }
        .sidebar-nav .toggle-icon {
            margin-left: auto;
            font-size: 14px;
            transition: transform 0.3s;
        }
        .sidebar-nav .toggle-icon.open { transform: rotate(90deg); }

        /* ---------- ОСНОВНОЙ КОНТЕНТ ---------- */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            position: relative;
            z-index: 1;
        }
        .page {
            display: none;
            animation: fadeSlideUp 0.5s ease;
        }
        .page.active { display: block; }
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .page-title {
            font-size: 28px;
            font-weight: 900;
            color: #e65100;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
            text-shadow: 2px 2px 0 #ffe0b0;
        }
        .page-sub {
            font-size: 16px;
            color: #ff7f50;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 3px dashed #ffb07c;
            padding-bottom: 10px;
        }

        /* ---------- КАРТОЧКИ ---------- */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
            margin-top: 10px;
        }
        .card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 16px;
            border: 3px solid #ffd9b3;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }
        .card:hover { transform: translateY(-5px); border-color: #ff7f50; box-shadow: 0 12px 30px rgba(255,127,80,0.15); }
        .card img, .card video {
            width: 100%;
            border-radius: 16px;
            margin-bottom: 10px;
            max-height: 160px;
            object-fit: cover;
            background: #fff2e0;
            border: 2px solid #ffd9b3;
        }
        .card video { max-height: 180px; }
        .card .file-icon { font-size: 44px; text-align: center; margin: 4px 0 10px; color: #ff7f50; }
        .card h4 { font-size: 16px; font-weight: 800; color: #4a2c1a; margin-bottom: 4px; }
        .card p { font-size: 13px; color: #6b4a2e; line-height: 1.5; flex: 1; }
        .card .meta {
            font-size: 11px;
            color: #998070;
            margin-top: 10px;
            border-top: 2px dotted #ffd9b3;
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card .delete-btn {
            background: #ff6b6b20;
            border: none;
            color: #ff6b6b;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card .delete-btn:active { background: #ff6b6b50; }

        /* ---------- ТЕКСТОВЫЕ БЛОКИ ---------- */
        .text-block {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 20px 24px;
            border: 3px solid #ffd9b3;
            line-height: 1.8;
            font-size: 15px;
            color: #3d2b1a;
            white-space: pre-wrap;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
        }
        .text-block .edit-area {
            width: 100%;
            min-height: 120px;
            border: 2px solid #ffd9b3;
            border-radius: 16px;
            padding: 14px;
            font-family: inherit;
            font-size: 14px;
            background: #fffcf5;
            color: #3d2b1a;
            resize: vertical;
            transition: 0.2s;
        }
        .text-block .edit-area:focus {
            border-color: #ff7f50;
            outline: none;
            box-shadow: 0 0 0 4px #ffb07c40;
        }

        /* ---------- ФОРМЫ ДОБАВЛЕНИЯ ---------- */
        .add-form {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 18px 20px;
            margin-top: 20px;
            border: 3px dashed #ffb07c;
            display: none;
        }
        .add-form.open { display: block; animation: fadeSlideUp 0.3s ease; }
        .add-form input,
        .add-form textarea,
        .add-form input[type="file"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ffd9b3;
            border-radius: 16px;
            font-size: 14px;
            margin-bottom: 12px;
            background: #fffcf5;
            color: #3d2b1a;
            transition: 0.2s;
            font-family: inherit;
        }
        .add-form input:focus,
        .add-form textarea:focus {
            border-color: #ff7f50;
            outline: none;
            box-shadow: 0 0 0 4px #ffb07c40;
        }
        .add-form textarea { min-height: 60px; resize: vertical; }
        .add-form .btn-row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 6px;
            flex-wrap: wrap;
        }

        /* ---------- КНОПКИ ---------- */
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 40px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            touch-action: manipulation;
            font-family: inherit;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary {
            background: linear-gradient(135deg, #ff7f50, #ff6a33);
            color: #fff;
            box-shadow: 0 4px 12px rgba(255,127,80,0.3);
        }
        .btn-primary:hover { box-shadow: 0 8px 20px rgba(255,127,80,0.4); transform: translateY(-2px); }
        .btn-secondary { background: #ffd9b3; color: #4a2c1a; }
        .btn-secondary:hover { background: #ffc999; }
        .add-btn {
            margin-top: 12px;
            padding: 10px 20px;
            border: 3px dashed #ffb07c;
            background: rgba(255,255,255,0.5);
            border-radius: 40px;
            font-weight: 800;
            color: #ff7f50;
            cursor: pointer;
            transition: 0.3s;
            font-size: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .add-btn:hover { background: #ffb07c20; border-color: #ff7f50; }

        /* ---------- КАРУСЕЛЬ ---------- */
        .carousel-container {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 16px 12px;
            border: 3px solid #ffd9b3;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.04);
            touch-action: pan-y;
        }
        .carousel-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 220px;
            position: relative;
            flex-direction: column;
        }
        .carousel-slide img,
        .carousel-slide video {
            max-width: 100%;
            max-height: 340px;
            border-radius: 16px;
            object-fit: contain;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border: 3px solid #ffd9b3;
            background: #fff;
        }
        .carousel-slide video {
            max-height: 400px;
            width: 100%;
        }
        .large-carousel .carousel-slide {
            min-height: 60vh;
        }
        .large-carousel .carousel-slide img,
        .large-carousel .carousel-slide video {
            max-height: 80vh;
            max-width: 95vw;
            border: 4px solid #ffb07c;
            box-shadow: 0 8px 40px rgba(0,0,0,0.15);
        }
        .large-carousel .carousel-slide video {
            max-height: 80vh;
            width: 95vw;
        }
        .carousel-slide .empty-msg { color: #998070; font-size: 16px; }
        .carousel-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .carousel-btn {
            background: #ffd9b3;
            border: none;
            border-radius: 40px;
            padding: 6px 18px;
            font-size: 22px;
            cursor: pointer;
            transition: 0.3s;
            color: #4a2c1a;
            touch-action: manipulation;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .carousel-btn:active:not(:disabled) { background: #ffb07c; transform: scale(0.95); }
        .carousel-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .carousel-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }
        .carousel-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffd9b3;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            padding: 0;
        }
        .carousel-dot.active {
            background: #ff7f50;
            transform: scale(1.3);
            box-shadow: 0 0 12px rgba(255,127,80,0.4);
        }
        .carousel-info {
            text-align: center;
            margin-top: 6px;
            color: #4a2c1a;
            font-size: 14px;
            font-weight: 600;
        }
        .carousel-delete-btn {
            background: #ff6b6b30;
            border: 2px solid #ff6b6b;
            color: #ff6b6b;
            border-radius: 40px;
            padding: 4px 16px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            touch-action: manipulation;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .carousel-delete-btn:hover { background: #ff6b6b50; }
        .carousel-delete-btn:active { transform: scale(0.95); }

        /* ---------- ГЛАВНОЕ ФОТО ---------- */
        .main-photo-wrapper {
            margin-bottom: 20px;
            text-align: center;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 24px;
            padding: 16px;
            border: 3px solid #ffd9b3;
        }
        .main-photo-wrapper img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 16px;
            object-fit: cover;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            border: 3px solid #ffb07c;
        }
        .main-photo-placeholder {
            width: 100%;
            min-height: 160px;
            background: #fff2e0;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #998070;
            font-size: 16px;
            flex-direction: column;
            gap: 6px;
        }
        .main-photo-placeholder .icon { font-size: 44px; }

        /* ---------- АДАПТИВ ---------- */
        @media (max-width: 768px) {
            .header-title { font-size: 17px; }
            .sidebar { width: 260px; left: -280px; }
            .main-content { padding: 16px 12px 30px; }
            .card-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
            .carousel-slide img, .carousel-slide video { max-height: 250px; }
            .page-title { font-size: 22px; }
            .large-carousel .carousel-slide { min-height: 40vh; }
            .large-carousel .carousel-slide img,
            .large-carousel .carousel-slide video { max-height: 70vh; }
            .header-right { justify-content: flex-end; }
        }
        @media (max-width: 480px) {
            .header { padding: 8px 12px; min-height: 52px; }
            .header-title { font-size: 15px; }
            .burger span { width: 24px; height: 3px; }
            .auth-status { font-size: 11px; padding: 4px 12px; }
            .sidebar { width: 240px; left: -260px; padding: 16px 12px; }
            .sidebar-profile .avatar { width: 56px; height: 56px; font-size: 26px; }
            .sidebar-profile h3 { font-size: 16px; }
            .sidebar-nav a { font-size: 14px; padding: 8px 12px; }
            .card-grid { grid-template-columns: 1fr; gap: 12px; }
            .card { padding: 14px; }
            .text-block { font-size: 14px; padding: 16px; }
            .page-title { font-size: 20px; }
            .carousel-slide { min-height: 160px; }
            .carousel-slide img, .carousel-slide video { max-height: 200px; }
            .main-photo-wrapper img { max-height: 200px; }
            .btn { padding: 8px 16px; font-size: 13px; }
            .large-carousel .carousel-slide { min-height: 30vh; }
            .large-carousel .carousel-slide img,
            .large-carousel .carousel-slide video { max-height: 60vh; }
        }
    </style>
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header class="header">
        <div class="header-left">
            <button class="burger" id="burgerBtn" aria-label="Меню">
                <span></span><span></span><span></span>
            </button>
            <span class="header-title">🌟 Портфолио</span>
        </div>
        <div class="header-right">
            <div class="auth-status" id="authStatus">🔒 Войти</div>
        </div>
    </header>

    <!-- ==================== ВЫДВИЖНОЕ МЕНЮ ==================== -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-profile">
            <div class="avatar">👩‍🏫</div>
            <h3>Шайбекова Ф.Б.</h3>
            <div class="sub">Учитель начальных классов</div>
        </div>
        <ul class="sidebar-nav" id="mainNav">
            <li><a class="active" data-page="home">🏠 Главная</a></li>
            <li id="personalToggle">
                <a style="justify-content:space-between;">
                    <span>👤 Личные данные</span>
                    <span class="toggle-icon">▶</span>
                </a>
                <ul class="sub-menu">
                    <li><a data-page="resume">📄 Резюме (фото)</a></li>
                    <li><a data-page="workbook">📒 Трудовая книжка</a></li>
                    <li><a data-page="contacts">📞 Контакты</a></li>
                    <li><a data-page="certificates">📜 Сертификаты</a></li>
                    <li><a data-page="awards">🏆 Награды</a></li>
                </ul>
            </li>
            <li><a data-page="materials">📚 Методические материалы</a></li>
            <li><a data-page="videos">🎥 Видеоуроки</a></li>
            <li><a data-page="photos">🖼️ Фотографии</a></li>
        </ul>
    </nav>

    <!-- ==================== ОСНОВНОЙ КОНТЕНТ ==================== -->
    <main class="main-content" id="contentArea"></main>

    <!-- ==================== СКРИПТЫ ==================== -->
    <script>
        // ========================================================================
        //  1. РАБОТА С INDEXEDDB
        // ========================================================================
        const DB_NAME = 'PortfolioDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'files';
        let db = null;

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        const store = db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        store.createIndex('type', 'type', { unique: false });
                    }
                };
                request.onsuccess = function(e) { db = e.target.result; resolve(db); };
                request.onerror = function(e) { reject(e.target.error); };
            });
        }

        function saveFileRecord(record) {
            return new Promise((resolve, reject) => {
                if (!db) return reject('База не открыта');
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const request = store.add(record);
                request.onsuccess = function(e) { resolve(e.target.result); };
                request.onerror = function(e) { reject(e.target.error); };
            });
        }

        function getFilesByType(type) {
            return new Promise((resolve, reject) => {
                if (!db) return reject('База не открыта');
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const index = store.index('type');
                const request = index.getAll(type);
                request.onsuccess = function(e) { resolve(e.target.result); };
                request.onerror = function(e) { reject(e.target.error); };
            });
        }

        function getAllFiles() {
            return new Promise((resolve, reject) => {
                if (!db) return reject('База не открыта');
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = function(e) { resolve(e.target.result); };
                request.onerror = function(e) { reject(e.target.error); };
            });
        }

        function deleteFileRecord(id) {
            return new Promise((resolve, reject) => {
                if (!db) return reject('База не открыта');
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const request = store.delete(id);
                request.onsuccess = function() { resolve(); };
                request.onerror = function(e) { reject(e.target.error); };
            });
        }

        function clearAllFiles() {
            return new Promise((resolve, reject) => {
                if (!db) return reject('База не открыта');
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                const request = store.clear();
                request.onsuccess = function() { resolve(); };
                request.onerror = function(e) { reject(e.target.error); };
            });
        }

                let mediaHtml = '';
                if (ft === 'image') {
                    mediaHtml = `<img src="${url}" alt="${item.title || 'Изображение'}" loading="lazy">`;
                } else if (ft === 'video') {
                    mediaHtml = `<video controls preload="metadata"><source src="${url}" type="${item.mime}"></video>`;
                } else {
                    mediaHtml = `<div class="file-icon" style="font-size:80px; color:#ff7f50;">📄</div>`;
                }
                slideHtml = `
                    <div class="carousel-slide">${mediaHtml}</div>
                    <div class="carousel-info">${item.title ? `<strong>${item.title}</strong>` : ''}${item.description ? ` — ${item.description}` : ''}</div>
                `;
            }

            let controlsHtml = '';
            if (total > 0) {
                controlsHtml = `
                    <div class="carousel-controls">
                        <button class="carousel-btn" onclick="changeCarousel('${type}', -1, '${pageId}')" ${index===0?'disabled':''}>◀</button>
                        <span style="font-size:16px; font-weight:700; color:#ff7f50;">${index+1} / ${total}</span>
                        <button class="carousel-btn" onclick="changeCarousel('${type}', 1, '${pageId}')" ${index===total-1?'disabled':''}>▶</button>
                    </div>
                    <div class="carousel-dots">
                        ${records.map((_, i) => `<button class="carousel-dot ${i===index?'active':''}" onclick="goToCarousel('${type}', ${i}, '${pageId}')"></button>`).join('')}
                    </div>
                `;

                if (editable) {
                    const currentId = records[index].id;
                    controlsHtml += `
                        <div style="text-align:center; margin-top:8px;">
                            <button class="carousel-delete-btn" onclick="deleteCurrentCarouselItem('${type}', ${currentId}, '${pageId}')">✕ Удалить</button>
                        </div>
                    `;
                }
            }

            let addHtml = '';
            if (editable) {
                const acceptAttr = acceptType || 'image/*';
                addHtml = `
                    <div style="margin-top:20px;">
                        <button class="add-btn" onclick="toggleForm('${type}')">➕ Добавить</button>
                        <div class="add-form" id="form_${type}">
                            <input type="text" id="title_${type}" placeholder="Название">
                            <textarea id="desc_${type}" placeholder="Краткое описание"></textarea>
                            <input type="file" id="file_${type}" accept="${acceptAttr}" required>
                            <div class="btn-row">
                                <button class="btn btn-secondary" onclick="toggleForm('${type}')">Отмена</button>
                                <button class="btn btn-primary" onclick="addMediaItem('${type}')">Добавить</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            const classAttr = extraClass ? `class="carousel-container ${extraClass}"` : `class="carousel-container"`;
            const titleText = customTitle || (type === 'resumePhoto' ? 'Резюме (фотографии)' : type === 'photo' ? 'Фотографии' : type === 'certificates' ? 'Сертификаты' : type === 'awards' ? 'Награды' : type === 'videos' ? 'Видеоуроки' : type === 'workbook' ? 'Трудовая книжка' : 'Изображения');
            container.innerHTML = `
                <h1 class="page-title">${titleText}</h1>
                <div class="page-sub">Всего: ${total}</div>
                <div ${classAttr} id="carouselContainer_${type}">${slideHtml}${controlsHtml}</div>
                ${addHtml}
            `;

            // Свайп
            const carouselEl = document.getElementById(`carouselContainer_${type}`);
            if (carouselEl && total > 0) {
                let startX = 0;
                carouselEl.addEventListener('touchstart', (e) => { startX = e.changedTouches[0].screenX; }, { passive: true });
                carouselEl.addEventListener('touchend', (e) => {
                    const endX = e.changedTouches[0].screenX;
                    const diff = startX - endX;
                    if (Math.abs(diff) > 40) {
                        if (diff > 0) changeCarousel(type, 1, pageId);
                        else changeCarousel(type, -1, pageId);
                    }
                }, { passive: true });
            }
        }

        // Функции управления каруселью (глобальные)
        window.changeCarousel = function(type, delta, pageId) {
            getFilesByType(type).then(records => {
                const total = records.length;
                if (total === 0) return;
                let idx = 0;
                if (type === 'resumePhoto') {
                    idx = (currentResumeIndex + delta + total) % total;
                    currentResumeIndex = idx;
                    renderPage('resume');
                } else if (type === 'workbook') {
                    idx = (currentWorkbookIndex + delta + total) % total;
                    currentWorkbookIndex = idx;
                    renderPage('workbook');
                } else if (type === 'photo') {
                    idx = (currentPhotoIndex + delta + total) % total;
                    currentPhotoIndex = idx;
                    renderPage('photos');
                } else if (type === 'certificates') {
                    idx = (currentCertificateIndex + delta + total) % total;
                    currentCertificateIndex = idx;
                    renderPage('certificates');
                } else if (type === 'awards') {
                    idx = (currentAwardIndex + delta + total) % total;
                    currentAwardIndex = idx;
                    renderPage('awards');
                } else if (type === 'videos') {
                    idx = (currentVideoIndex + delta + total) % total;
                    currentVideoIndex = idx;
                    renderPage('videos');
                }
            });
        };

        window.goToCarousel = function(type, index, pageId) {
            getFilesByType(type).then(records => {
                if (index < 0 || index >= records.length) return;
                if (type === 'resumePhoto') {
                    currentResumeIndex = index;
                    renderPage('resume');
                } else if (type === 'workbook') {
                    currentWorkbookIndex = index;
                    renderPage('workbook');
                } else if (type === 'photo') {
                    currentPhotoIndex = index;
                    renderPage('photos');
                } else if (type === 'certificates') {
                    currentCertificateIndex = index;
                    renderPage('certificates');
                } else if (type === 'awards') {
                    currentAwardIndex = index;
                    renderPage('awards');
                } else if (type === 'videos') {
                    currentVideoIndex = index;
                    renderPage('videos');
                }
            });
        };

        // Функция удаления текущего элемента в карусели
        window.deleteCurrentCarouselItem = async function(type, id, pageId) {
            if (!confirm('Удалить этот элемент?')) return;
            try {
                await deleteFileRecord(id);
                const records = await getFilesByType(type);
                const total = records.length;
                if (type === 'resumePhoto') {
                    if (currentResumeIndex >= total) currentResumeIndex = Math.max(0, total - 1);
                    await renderPage('resume');
                } else if (type === 'workbook') {
                    if (currentWorkbookIndex >= total) currentWorkbookIndex = Math.max(0, total - 1);
                    await renderPage('workbook');
                } else if (type === 'photo') {
                    if (currentPhotoIndex >= total) currentPhotoIndex = Math.max(0, total - 1);
                    await renderPage('photos');
                } else if (type === 'certificates') {
                    if (currentCertificateIndex >= total) currentCertificateIndex = Math.max(0, total - 1);
                    await renderPage('certificates');
                } else if (type === 'awards') {
                    if (currentAwardIndex >= total) currentAwardIndex = Math.max(0, total - 1);
                    await renderPage('awards');
                } else if (type === 'videos') {
                    if (currentVideoIndex >= total) currentVideoIndex = Math.max(0, total - 1);
                    await renderPage('videos');
                }
            } catch (e) {
                alert('Ошибка удаления: ' + e.message);
            }
        };

        // ------ Добавление / удаление медиа (общее) ------
        window.addMediaItem = async function(type) {
            const titleInput = document.getElementById(`title_${type}`);
            const descInput = document.getElementById(`desc_${type}`);
            const fileInput = document.getElementById(`file_${type}`);
            const title = titleInput.value.trim() || 'Без названия';
            const desc = descInput.value.trim() || '';
            const file = fileInput.files[0];
            if (!file) { alert('Выберите файл!'); return; }
            try {
                await saveFileRecord({ type, title, description: desc, file, mime: file.type, date: Date.now() });
                titleInput.value = ''; descInput.value = ''; fileInput.value = '';
                toggleForm(type);
                const records = await getFilesByType(type);
                if (type === 'resumePhoto') {
                    currentResumeIndex = records.length - 1;
                    await renderPage('resume');
                } else if (type === 'workbook') {
                    currentWorkbookIndex = records.length - 1;
                    await renderPage('workbook');
                } else if (type === 'photo') {
                    currentPhotoIndex = records.length - 1;
                    await renderPage('photos');
                } else if (type === 'certificates') {
                    currentCertificateIndex = records.length - 1;
                    await renderPage('certificates');
                } else if (type === 'awards') {
                    currentAwardIndex = records.length - 1;
                    await renderPage('awards');
                } else if (type === 'videos') {
                    currentVideoIndex = records.length - 1;
                    await renderPage('videos');
                } else {
                    await renderPage(type);
                }
            } catch (e) { alert('Ошибка: ' + e.message); }
        };

        window.deleteMediaItem = async function(type, id) {
            if (!confirm('Удалить этот элемент?')) return;
            try {
                await deleteFileRecord(id);
                if (type === 'resumePhoto') {
                    const records = await getFilesByType('resumePhoto');
                    if (currentResumeIndex >= records.length) currentResumeIndex = Math.max(0, records.length - 1);
                    await renderPage('resume');
                } else if (type === 'workbook') {
                    const records = await getFilesByType('workbook');
                    if (currentWorkbookIndex >= records.length) currentWorkbookIndex = Math.max(0, records.length - 1);
                    await renderPage('workbook');
                } else if (type === 'photo') {
                    const records = await getFilesByType('photo');
                    if (currentPhotoIndex >= records.length) currentPhotoIndex = Math.max(0, records.length - 1);
                    await renderPage('photos');
                } else if (type === 'certificates') {
                    const records = await getFilesByType('certificates');
                    if (currentCertificateIndex >= records.length) currentCertificateIndex = Math.max(0, records.length - 1);
                    await renderPage('certificates');
                } else if (type === 'awards') {
                    const records = await getFilesByType('awards');
                    if (currentAwardIndex >= records.length) currentAwardIndex = Math.max(0, records.length - 1);
                    await renderPage('awards');
                } else if (type === 'videos') {
                    const records = await getFilesByType('videos');
                    if (currentVideoIndex >= records.length) currentVideoIndex = Math.max(0, records.length - 1);
                    await renderPage('videos');
                } else {
                    await renderPage(type);
                }
            } catch (e) { alert('Ошибка: ' + e.message); }
        };

        window.toggleForm = function(type) {
            const form = document.getElementById(`form_${type}`);
            if (form) form.classList.toggle('open');
        };

        // ------ Навигация ------
        function navigateTo(page) { renderPage(page); }

        navLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const page = this.dataset.page;
                if (page) navigateTo(page);
            });
        });

        personalToggle.querySelector('a').addEventListener('click', function(e) {
            e.preventDefault();
            subMenu.classList.toggle('open');
            toggleIcon.classList.toggle('open');
        });

        // ------ Аутентификация ------
        authStatus.addEventListener('click', function() {
            if (!isLogged) {
                const pwd = prompt('Введите пароль для редактирования:');
                if (pwd === PASSWORD) {
                    isLogged = true;
                    authStatus.textContent = '🔓 Редактор';
                    authStatus.classList.add('logged');
                    const activeLink = document.querySelector('.sidebar-nav a.active');
                    if (activeLink) renderPage(activeLink.dataset.page);
                    else renderPage('home');
                } else {
                    alert('Неверный пароль!');
                }
            } else {
                isLogged = false;
                authStatus.textContent = '🔒 Войти';
                authStatus.classList.remove('logged');
                const activeLink = document.querySelector('.sidebar-nav a.active');
                if (activeLink) renderPage(activeLink.dataset.page);
                else renderPage('home');
            }
        });

        // ========================================================================
        //  5. ИНИЦИАЛИЗАЦИЯ
        // ========================================================================
        async function init() {
            try {
                await openDB();
                initTexts();
                await seedDatabase();
                await renderPage('home');
            } catch (e) {
                alert('Ошибка инициализации: ' + e.message);
            }
        }

        init();
    </script>
</body>
</html>
